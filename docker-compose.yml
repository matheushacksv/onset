services:
  db:
    image: pgvector/pgvector:pg17
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  knowledge-builder:
    build: ./backend
    command: uv run python manage.py build_knowledge
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:5
    networks:
      - default

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onset-api.rule=Host(`apionboarding.henriquegoularte.com.br`)"
      - "traefik.http.routers.onset-api.entrypoints=websecure"
      - "traefik.http.routers.onset-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.onset-api.loadbalancer.server.port=8000"

  worker:
    build: ./backend
    command: uv run python manage.py qcluster
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # Resolver apionboarding via upstream (1.1.1.1) FALHA ~40% dentro do container
    # (EAI_AGAIN na zona henriquegoularte.com.br) → proxy interno /api dava 502 Bad
    # Gateway intermitente. Pin no IP do host pula o DNS flaky; request ainda entra
    # pelo Traefik (:443), que buffera o gunicorn.
    # ponytail: IP fixo do host. Se o IP do servidor mudar, atualizar aqui.
    extra_hosts:
      - "apionboarding.henriquegoularte.com.br:178.156.169.148"
    environment:
      NUXT_PUBLIC_BACKEND_URL: https://apionboarding.henriquegoularte.com.br
      # Proxy interno (/api/**) vai via Traefik (URL pública, resolvida pelo pin acima),
      # NÃO direto em backend:8000 — undici direto no gunicorn = 400 intermitente
      # ("Invalid HTTP request" do gunicorn, some quando o Traefik buffera a conexão).
      NUXT_INTERNAL_BACKEND_URL: https://apionboarding.henriquegoularte.com.br
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onset-app.rule=Host(`onboarding.henriquegoularte.com.br`)"
      - "traefik.http.routers.onset-app.entrypoints=websecure"
      - "traefik.http.routers.onset-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.onset-app.loadbalancer.server.port=3000"

networks:
  default:
  traefik:
    external: true
    name: OHenriquecedorNet

volumes:
  postgres_data:
  redis_data:
